server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Behind the ingress: a directory-to-slash redirect must be relative, so
    # it never leaks :8080 or http://.
    absolute_redirect off;
    port_in_redirect off;
    charset utf-8;

    # Server level only: a location with its own add_header drops these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content-Security-Policy, report-only for now. There is no report-uri:
    # with no collector, a browser still logs each violation to its console,
    # which is where to look before switching this to enforcing.
    #   script-src: the hashes are Quartz's inline scripts, the contentIndex
    #     fetch from renderPage.tsx (one per page depth: "/", "./", then "../"
    #     up to five deep) and the case-redirect script in pages/404.tsx; a
    #     change to either source needs new hashes. 'unsafe-eval' is for the
    #     explorer, which builds its sort/filter/map with new Function. The
    #     CDN paths are KaTeX's copy-tex and the mermaid ESM bundle, which is
    #     only imported on a page with a mermaid diagram.
    #   style-src 'unsafe-inline': Quartz, KaTeX and mermaid emit style
    #     attributes and <style> elements, too many and too content-dependent
    #     to hash.
    #   img-src data: the stylesheets draw icons as data: SVGs.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-eval' 'sha256-26KsxcYYxZCwmG2ho9eotclt/D8QIgCYU6DUNU46mT4=' 'sha256-ToyrjEgxDDchSN6B5DAZBdYc3FmjH4tzXNfd/m7Jo08=' 'sha256-AE0EQudVMDsl926YZzlYRgeKgzPan7WBWeH3xMTf9kE=' 'sha256-LxtIciogoF9L7bvizkV5RJxWGc4gmBIqgvQ1i472vrQ=' 'sha256-eDjxevRbA7sX54Mpz0GfP2DD0hwnFfEKzL1z10WTm/M=' 'sha256-gO2KhdZHTcLY347D0CeRiDQRLSlvGzrB/K7sRW9hlOM=' 'sha256-q1oeFq6jcG3MmgFoSfzAPZYdDdw8L3p3/YS230zuw2k=' 'sha256-RCv5Phrq46Vv+SHtmERFJwyGssJKMXOf7yIbGTwQuwY=' https://cdn.jsdelivr.net/npm/katex@0.16.11/ https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.4.0/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net/npm/katex@0.16.11/; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net/npm/katex@0.16.11/; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    # No Strict-Transport-Security here: ingress-nginx terminates TLS and
    # sends it, and a second copy would be a duplicate header.

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/xml application/rss+xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Quartz emits extensionless routes as <slug>.html and folders as
    # <folder>/index.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
