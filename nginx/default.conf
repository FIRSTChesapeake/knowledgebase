server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Behind the ingress: a directory-to-slash redirect must be relative, so
    # it never leaks :8080 or http://.
    absolute_redirect off;
    port_in_redirect off;
    charset utf-8;

    # Server level only: a location with its own add_header drops these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml text/xml application/rss+xml image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Quartz emits extensionless routes as <slug>.html and folders as
    # <folder>/index.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
