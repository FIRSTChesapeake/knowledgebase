name: Deploy knowledgebase

# Publishing is tag-driven: merging to main changes nothing on the live site
# until a version tag (vX.Y.Z) is pushed, and only a commit already on main
# may be released. There is no manual dispatch: a run without a tag has no
# version to publish.
#
# The guard job below runs from the workflow file at the tagged commit, so a
# tag on an unmerged commit could carry an edited copy of it. It is a safety
# net; the security control is the repo settings in k8s-do/README.md
# (image-publish environment limited to v* tags, and a tag ruleset on v*).
#
# The site is served only from the Kubernetes cluster; GitHub Pages is no
# longer published. One run releases it (image, manifests). This workflow holds no cluster
# credential and no secret but GITHUB_TOKEN: it pushes the image and a
# release artifact of k8s-do/ to GHCR, and the cluster pulls the artifact
# itself. Every job needs guard, directly or through another job.
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

# One run per release tag at a time, never cancelled: two runs for the same
# tag would otherwise both find it free, and the second push would replace
# the first.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # The one definition of a release tag: v + SemVer 2.0, without build
  # metadata (a + is not allowed in an OCI tag). Every step that reads the
  # tag checks it against this.
  VERSION_TAG_RE: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$'

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      # The repo is public: fetching main needs no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only commits already merged to main may be released. Every job
      # needs this one, so a failure here stops the publish. Fails closed:
      # a missing origin/main is a failure, not a pass.
      - name: Require the deployed commit to be on main
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if ! git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main \
             || ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::Could not fetch origin/main; refusing to deploy ${DEPLOY_SHA}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" refs/remotes/origin/main; then
            echo "::error::Commit ${DEPLOY_SHA} is not on main. Merge it to main first, then tag a commit on main."
            exit 1
          fi
          echo "Commit ${DEPLOY_SHA} is on main."

  # Builds the site into an nginx image (see Dockerfile) and pushes it to
  # GHCR tagged with the version only. It first refuses a version already
  # released, so a re-run never moves a released image's tag. The job's
  # output is the pushed digest, and the release pins the image by digest. The image-publish environment (v* tags only,
  # no reviewers) stops this unmodified workflow from pushing from any other
  # ref. Like the guard it is not a control against repo writers (an
  # edited workflow can drop it); manifests only uses the digest this run
  # pushed.
  image:
    needs: guard
    runs-on: ubuntu-22.04
    environment: image-publish
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
      manifests: ${{ steps.tags.outputs.manifests }}
    steps:
      # Full history: Quartz reads page dates from git inside the build.
      # No persisted token: .git is copied into the image's builder stage.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The whole value, not line by line: a second line would become a
      # build-arg of its own.
      - name: Validate APP_DOMAIN
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          label='[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?'
          if [[ "$APP_DOMAIN" == *$'\n'* || ${#APP_DOMAIN} -gt 253 || ! "$APP_DOMAIN" =~ ^${label}(\.${label})+$ ]]; then
            echo "::error::Repo variable APP_DOMAIN must be set to a lowercase hostname."
            exit 1
          fi
      - name: Compute image tags
        id: tags
        run: |
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/${owner_lower}/knowledgebase"
          # The tag becomes a docker tag in a comma-separated list: admit only
          # a release version, so a tag name can't add tags of its own.
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" == *$'\n'* || ${#GITHUB_REF_NAME} -gt 128 || ! "$GITHUB_REF_NAME" =~ $VERSION_TAG_RE ]]; then
            echo "::error::Unexpected version tag '${GITHUB_REF_NAME}'."
            exit 1
          fi
          {
            echo "repo=${repo}"
            echo "manifests=ghcr.io/${owner_lower}/manifests/knowledgebase"
            echo "tags=${repo}:${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          version: 2.9.6
      # The same check the manifests job makes before it pushes, made here
      # before anything is built, so a released version's image tag is never
      # moved.
      - name: Refuse to overwrite a release
        env:
          MANIFESTS: ${{ steps.tags.outputs.manifests }}
        run: |
          ref="oci://${MANIFESTS}:${GITHUB_REF_NAME}"
          mkdir -p "${RUNNER_TEMP}/existing"
          if out="$(flux pull artifact "$ref" --output "${RUNNER_TEMP}/existing" 2>&1)"; then
            echo "::error::${ref} already exists. Release tags are immutable; cut a new tag."
            exit 1
          fi
          if ! grep -Eq 'MANIFEST_UNKNOWN|NAME_UNKNOWN' <<<"$out"; then
            echo "::error::Could not tell whether ${ref} exists; nothing was pushed."
            printf '%s\n' "$out"
            exit 1
          fi
          echo "${ref} is free."
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # context: . builds from the checkout above (with .git); the action's
      # default Git context would clone without history. No registry cache:
      # it would push the builder stage, .git included. No build record
      # upload: it would publish the build log as a run artifact.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_DOMAIN=${{ vars.APP_DOMAIN }}
      - name: Image reference by digest
        id: digest
        env:
          REPO: ${{ steps.tags.outputs.repo }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="${REPO}@${DIGEST}"
          if [[ "$image" == *$'\n'* || ! "$image" =~ ^ghcr\.io/[a-z0-9-]+/knowledgebase@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image reference '${image}'."
            exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  # Publishes k8s-do/ as the release artifact the cluster pulls:
  # oci://ghcr.io/<owner>/manifests/knowledgebase:<tag>. The image is pinned
  # by the digest the image job pushed, written into this job's copy of
  # kustomization.yaml only, never committed. The cluster deploys the
  # highest version in its range within minutes, so a pushed tag is a
  # release: an existing one is never overwritten.
  manifests:
    needs: [guard, image]
    runs-on: ubuntu-24.04
    environment: image-publish
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      MANIFESTS: ${{ needs.image.outputs.manifests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          version: 2.9.6
      # A pinned release, checked against its published sha256.
      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.8.3
          KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
        run: |
          dir="${RUNNER_TEMP}/kustomize"
          mkdir -p "$dir"
          tarball="${dir}/kustomize.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" -C "$dir" kustomize
          echo "$dir" >> "$GITHUB_PATH"
      # A pinned release, checked against its published sha256. It goes
      # ahead of the runner's own yq on PATH.
      - name: Install yq
        env:
          YQ_VERSION: v4.54.1
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          dir="${RUNNER_TEMP}/yq"
          mkdir -p "$dir"
          curl -fsSL -o "${dir}/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  ${dir}/yq" | sha256sum -c -
          chmod +x "${dir}/yq"
          echo "$dir" >> "$GITHUB_PATH"
      # Whole-value checks (a newline fails them): each value reaches a
      # command line or the artifact's address.
      - name: Validate inputs
        run: |
          fail=0
          if [[ "$IMAGE" == *$'\n'* || ! "$IMAGE" =~ ^ghcr\.io/[a-z0-9-]+/knowledgebase@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image reference '${IMAGE}'."
            fail=1
          fi
          if [[ "$MANIFESTS" == *$'\n'* || ! "$MANIFESTS" =~ ^ghcr\.io/[a-z0-9-]+/manifests/knowledgebase$ ]]; then
            echo "::error::Unexpected artifact repository '${MANIFESTS}'."
            fail=1
          fi
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" == *$'\n'* || ${#GITHUB_REF_NAME} -gt 128 || ! "$GITHUB_REF_NAME" =~ $VERSION_TAG_RE ]]; then
            echo "::error::Unexpected version tag '${GITHUB_REF_NAME}'."
            fail=1
          fi
          exit "$fail"
      - name: Bake the image digest
        working-directory: k8s-do
        run: kustomize edit set image "knowledgebase=${IMAGE}"
      # Fails closed on what the cluster would apply. yq turns the baked
      # kustomization.yaml and the built objects into JSON, so quoting and
      # flow style can't hide anything, and scripts/check-release.mjs
      # allow-lists them: kustomization keys and local resources only, kinds
      # Service, Deployment and Ingress, and every image the digest this run
      # pushed. The cluster never takes Secrets from a release.
      - name: Check the release
        run: |
          kustomize build k8s-do > "${RUNNER_TEMP}/built.yaml"
          yq -o=json -I=0 '.' k8s-do/kustomization.yaml > "${RUNNER_TEMP}/kustomization.jsonl"
          yq -o=json -I=0 '.' "${RUNNER_TEMP}/built.yaml" > "${RUNNER_TEMP}/built.jsonl"
          node scripts/check-release.mjs "${RUNNER_TEMP}/kustomization.jsonl" "${RUNNER_TEMP}/built.jsonl"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # flux push artifact silently replaces an existing tag. Only the
      # registry's "not found" means the tag is free; any other failure
      # stops the release. A re-run after a failed push still works.
      - name: Refuse to overwrite a release
        run: |
          ref="oci://${MANIFESTS}:${GITHUB_REF_NAME}"
          mkdir -p "${RUNNER_TEMP}/existing"
          if out="$(flux pull artifact "$ref" --output "${RUNNER_TEMP}/existing" 2>&1)"; then
            echo "::error::${ref} already exists. Release tags are immutable; cut a new tag."
            exit 1
          fi
          if ! grep -Eq 'MANIFEST_UNKNOWN|NAME_UNKNOWN' <<<"$out"; then
            echo "::error::Could not tell whether ${ref} exists; nothing was pushed."
            printf '%s\n' "$out"
            exit 1
          fi
          echo "${ref} is free."
      - name: Push the release artifact
        run: |
          out="$(flux push artifact "oci://${MANIFESTS}:${GITHUB_REF_NAME}" \
            --path=./k8s-do \
            --source="https://github.com/${GITHUB_REPOSITORY}" \
            --revision="${GITHUB_REF_NAME}@sha1:${GITHUB_SHA}" \
            --output=json)"
          echo "Pushed oci://${MANIFESTS}:${GITHUB_REF_NAME} ($(jq -r .digest <<<"$out"))."
