name: Deploy knowledgebase

# Publishing is tag-driven: merging to main changes nothing on the live site
# until a version tag (vX.Y.Z) is pushed. workflow_dispatch re-publishes a
# version: dispatch it from the v* tag ("Use workflow from"), never from a
# branch; the production and image-publish environments refuse any other
# ref. Either way, only a commit already on main may deploy.
#
# The guard job below runs from the workflow file at the deployed ref, so a
# tag on an unmerged commit could carry an edited copy of it. It is a safety
# net; the security control is the repo settings in k8s-do/README.md
# (production and image-publish environments limited to v* tags, required
# reviewers on production, and a tag ruleset on v*).
#
# One run publishes to both GitHub Pages (build, deploy) and the Kubernetes
# cluster (image, deploy-cluster). Every job needs guard, directly or
# through another job.
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-22.04
    steps:
      # The repo is public: fetching main needs no token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only commits already merged to main may deploy. A dispatch from main
      # itself passes this check and republishes Pages from main, but the
      # image-publish and production environments refuse any ref but a v*
      # tag, so the cluster is untouched. Every job needs this one, so a
      # failure here stops the publish. Fails closed: a missing origin/main
      # is a failure, not a pass.
      - name: Require the deployed commit to be on main
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if ! git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main \
             || ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::Could not fetch origin/main; refusing to deploy ${DEPLOY_SHA}."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$DEPLOY_SHA" refs/remotes/origin/main; then
            echo "::error::Commit ${DEPLOY_SHA} is not on main. Merge it to main first, then tag a commit on main."
            exit 1
          fi
          echo "Commit ${DEPLOY_SHA} is on main."

  build:
    needs: guard
    runs-on: ubuntu-22.04
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch all history for git info
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      # Builds the local frontmatter plugin in plugins/note-properties (the other
      # plugins come from npm ci). --from-config resolves it from its relative
      # path in quartz.config.yaml; there is no committed quartz.lock.json.
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Builds the site into an nginx image (see Dockerfile) and pushes it to
  # GHCR tagged :sha-<commit> and with the version tag. Tags can be moved by
  # a later push, so the job's output is the pushed digest, and the cluster
  # deploys by digest. The image-publish environment (v* tags only, no
  # reviewers) stops this unmodified workflow from pushing from any other
  # ref. Like the guard it is not a control against repo writers (an
  # edited workflow can drop it); deploy-cluster only uses the digest this
  # run pushed.
  image:
    needs: guard
    runs-on: ubuntu-22.04
    environment: image-publish
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      # Full history: Quartz reads page dates from git inside the build.
      # No persisted token: .git is copied into the image's builder stage.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The whole value, not line by line: a second line would become a
      # build-arg of its own.
      - name: Validate APP_DOMAIN
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          label='[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?'
          if [[ "$APP_DOMAIN" == *$'\n'* || ${#APP_DOMAIN} -gt 253 || ! "$APP_DOMAIN" =~ ^${label}(\.${label})+$ ]]; then
            echo "::error::Repo variable APP_DOMAIN must be set to a lowercase hostname."
            exit 1
          fi
      - name: Compute image tags
        id: tags
        run: |
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          repo="ghcr.io/${owner_lower}/knowledgebase"
          tags="${repo}:sha-${GITHUB_SHA::12}"
          # The version tag joins a comma-separated list: admit only a plain
          # version, so a tag name can't add tags of its own.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.-]*$ ]]; then
              echo "::error::Unexpected version tag '${GITHUB_REF_NAME}'."
              exit 1
            fi
            tags="${tags},${repo}:${GITHUB_REF_NAME}"
          fi
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # context: . builds from the checkout above (with .git); the action's
      # default Git context would clone without history. No registry cache:
      # it would push the builder stage, .git included. No build record
      # upload: it would publish the build log as a run artifact.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            APP_DOMAIN=${{ vars.APP_DOMAIN }}
      - name: Image reference by digest
        id: digest
        env:
          REPO: ${{ steps.tags.outputs.repo }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="${REPO}@${DIGEST}"
          if [[ "$image" == *$'\n'* || ! "$image" =~ ^ghcr\.io/[a-z0-9-]+/knowledgebase@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image reference '${image}'."
            exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  # Renders k8s-do/*.yaml and applies it with the namespace-scoped
  # kb-deployer credential. The bootstrap/ manifests are applied by hand,
  # never here. A failed rollout is rolled back.
  deploy-cluster:
    needs: [image]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    environment:
      name: production
      url: https://${{ vars.APP_DOMAIN }}
    concurrency:
      group: knowledgebase-cluster
      cancel-in-progress: false
    env:
      NS: ${{ vars.K8S_NAMESPACE }}
      APP_DOMAIN: ${{ vars.APP_DOMAIN }}
      IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Whole-value checks (a newline fails them): each value is rendered
      # into the manifests with sed.
      - name: Validate inputs
        run: |
          fail=0
          label='[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?'
          if [[ "$NS" == *$'\n'* || ! "$NS" =~ ^${label}$ ]]; then
            echo "::error::Repo variable K8S_NAMESPACE must be set to a namespace name."
            fail=1
          fi
          if [[ "$APP_DOMAIN" == *$'\n'* || ${#APP_DOMAIN} -gt 253 || ! "$APP_DOMAIN" =~ ^${label}(\.${label})+$ ]]; then
            echo "::error::Repo variable APP_DOMAIN must be set to a lowercase hostname."
            fail=1
          fi
          if [[ "$IMAGE" == *$'\n'* || ! "$IMAGE" =~ ^ghcr\.io/[a-z0-9-]+/knowledgebase@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image reference '${IMAGE}'."
            fail=1
          fi
          exit "$fail"
      - name: Write kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_KB }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::Environment secret KUBECONFIG_KB is not set."
            exit 1
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Render manifests
        run: |
          rm -rf k8s-do-rendered
          mkdir k8s-do-rendered
          cp k8s-do/*.yaml k8s-do-rendered/
          sed -i \
            -e "s|__PROJECT_NAMESPACE__|$NS|g" \
            -e "s|__APP_DOMAIN__|$APP_DOMAIN|g" \
            -e "s|__IMAGE__|$IMAGE|g" \
            k8s-do-rendered/*.yaml
          if grep -rl '__[A-Z_]*__' k8s-do-rendered; then
            echo "::error::Unrendered placeholders remain in the files above."
            exit 1
          fi
      - name: Record current revision
        run: |
          # Only a missing Deployment (NotFound, which --ignore-not-found
          # turns into empty output) is a first deploy. Any other error
          # (expired token, unreachable API server) stops the run here,
          # before anything is applied.
          if ! before="$(kubectl -n "$NS" get deployment knowledgebase --ignore-not-found \
            -o jsonpath='{.metadata.annotations.deployment\.kubernetes\.io/revision}')"; then
            echo "::error::Could not read deployment/knowledgebase; nothing was applied."
            exit 1
          fi
          # Empty on the first deploy; otherwise a revision number, and
          # nothing else may reach GITHUB_ENV.
          if [[ -n "$before" && ! "$before" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected revision annotation on deployment/knowledgebase."
            exit 1
          fi
          echo "BEFORE=${before}" >> "$GITHUB_ENV"
      - name: Apply manifests
        id: apply
        run: |
          kubectl -n "$NS" apply -f k8s-do-rendered/service.yaml
          kubectl -n "$NS" apply -f k8s-do-rendered/deployment.yaml
          kubectl -n "$NS" apply -f k8s-do-rendered/ingress.yaml
      - name: Wait for rollout
        id: rollout
        run: kubectl -n "$NS" rollout status deployment/knowledgebase --timeout=300s
      # Only once the apply has run: an earlier failure changed nothing on
      # the cluster, and an undo then would roll back the healthy release.
      # Nothing but the recorded revision is undone to: with no BEFORE (the
      # first deploy) there is nothing to roll back to. This run log is
      # public: no pod logs (the access log holds visitor IPs) and no pod or
      # node IPs.
      - name: Diagnose and roll back
        if: failure() && (steps.apply.outcome == 'failure' || steps.rollout.outcome == 'failure')
        run: |
          kubectl -n "$NS" get pods -l app.kubernetes.io/name=knowledgebase || true
          kubectl -n "$NS" describe deployment knowledgebase || true
          kubectl -n "$NS" get events --sort-by=.lastTimestamp | tail -n 30 || true
          if [ -n "${BEFORE:-}" ]; then
            kubectl -n "$NS" rollout undo deployment/knowledgebase --to-revision="$BEFORE" || true
          else
            echo "::warning::First deploy: no earlier revision to roll back to."
          fi
          exit 1
