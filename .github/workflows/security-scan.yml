name: Security scan (CodeQL)

# CodeQL code scanning for the workflows (actions) and the site's
# JavaScript/TypeScript, on pull requests into main, pushes to main, a weekly
# schedule and manual dispatch. This replaces CodeQL's repository-settings
# "default setup", which must stay disabled: GitHub rejects advanced-setup
# uploads while default setup is enabled. Alert categories match the ones
# default setup used, so existing alerts carry over.

# Expressions have no substring/split, so a push is titled by its head commit
# message, as GitHub's default push title is.
run-name: >-
  ${{
    github.event_name == 'pull_request'
      && format('Security scan: PR #{0} {1}', github.event.pull_request.number, github.event.pull_request.title)
    || github.event_name == 'push'
      && format('Security scan: main - {0}', github.event.head_commit.message)
    || github.event_name == 'schedule'
      && 'Security scan: weekly scan of main'
    || format('Security scan: manual scan of {0}', github.ref_name)
  }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '27 4 * * 1' # Mondays 04:27 UTC
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels that PR's in-progress scan. Pushes to main,
# scheduled and manual runs each get their own group, so none is ever
# cancelled or superseded while queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    # Draft PRs are skipped; ready_for_review scans them once they're opened up.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
