# Static knowledgebase site: nginx serving the Quartz build baked into the
# image. __IMAGE__ is rendered by the deploy workflow to the immutable
# :sha-<commit> tag, so applying this file is the deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledgebase
  namespace: __PROJECT_NAMESPACE__
  labels:
    app.kubernetes.io/name: knowledgebase
    app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledgebase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledgebase
        app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
    spec:
      # The site talks to no Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Numeric, and equal to the Dockerfile's USER: the kubelet can only
        # verify runAsNonRoot against a numeric uid.
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: knowledgebase
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # The image entrypoint tries to edit its conf on a read-only
            # root, logs that it can't and carries on; keep that quiet.
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          volumeMounts:
            # nginx-unprivileged keeps its pid and temp files under /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
