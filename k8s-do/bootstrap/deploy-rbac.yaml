# The deploy workflow's identity: a ServiceAccount confined to this
# namespace. Applied once by a cluster admin (see k8s-do/README.md), never
# by CI. Its token is the credential in the KUBECONFIG_KB secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kb-deployer
  namespace: __PROJECT_NAMESPACE__
  labels:
    app.kubernetes.io/name: knowledgebase
    app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
automountServiceAccountToken: false
---
# Long-lived token. Rotate by deleting this Secret and applying the file
# again; the old token dies with the Secret.
apiVersion: v1
kind: Secret
metadata:
  name: kb-deployer-token
  namespace: __PROJECT_NAMESPACE__
  labels:
    app.kubernetes.io/name: knowledgebase
    app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
  annotations:
    kubernetes.io/service-account.name: kb-deployer
type: kubernetes.io/service-account-token
---
# Only what `kubectl apply` of the app manifests, rollout status/undo and
# failure diagnostics need. No secrets, no delete, nothing cluster-scoped:
# the app has no ConfigMaps, Secrets or Jobs, and cert-manager creates the
# Certificate from the Ingress annotation under its own identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kb-deployer
  namespace: __PROJECT_NAMESPACE__
  labels:
    app.kubernetes.io/name: knowledgebase
    app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kb-deployer
  namespace: __PROJECT_NAMESPACE__
  labels:
    app.kubernetes.io/name: knowledgebase
    app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kb-deployer
subjects:
  - kind: ServiceAccount
    name: kb-deployer
    namespace: __PROJECT_NAMESPACE__
