# What the deploy credential may write. Applied once by a cluster admin (see
# k8s-do/README.md), never by CI.
#
# RBAC lets kb-deployer create and patch Deployments, Services and Ingresses,
# but cannot say what they contain. Without these policies the credential
# could run any pod spec (and read whatever that pod can reach) or claim any hostname on the shared load balancer and get a
# certificate for it. Each policy matches only requests made as kb-deployer,
# so cert-manager's own HTTP-01 solver Ingress, Service and pod in this
# namespace are not affected. Pod Security "restricted" on the namespace
# covers privileged and host-level pod settings for everyone.
#
# The policies and bindings are cluster-scoped, so their names carry the
# namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: __PROJECT_NAMESPACE__-kb-deployer-deployments
  labels:
    app.kubernetes.io/name: knowledgebase
    app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
  matchConditions:
    - name: deploy-credential-only
      expression: "request.userInfo.username == 'system:serviceaccount:__PROJECT_NAMESPACE__:kb-deployer'"
  variables:
    - name: pod
      expression: "object.spec.template.spec"
    - name: containers
      expression: "variables.pod.containers + (has(variables.pod.initContainers) ? variables.pod.initContainers : [])"
  validations:
    - expression: "object.metadata.name == 'knowledgebase'"
      message: "kb-deployer may only write the Deployment named knowledgebase."
    - expression: "!has(variables.pod.volumes) || variables.pod.volumes.all(v, has(v.emptyDir))"
      message: "Only emptyDir volumes are allowed."
    - expression: >-
        (!has(variables.pod.serviceAccountName) || variables.pod.serviceAccountName in ['', 'default'])
        && (!has(variables.pod.serviceAccount) || variables.pod.serviceAccount in ['', 'default'])
      message: "The pod must use the namespace's default ServiceAccount."
    - expression: "has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false"
      message: "automountServiceAccountToken must be false."
    - expression: "variables.containers.all(c, c.image.matches('^ghcr[.]io/__GHCR_OWNER__/knowledgebase@sha256:[0-9a-f]{64}$'))"
      message: "Images must be ghcr.io/__GHCR_OWNER__/knowledgebase pinned by sha256 digest."
    - expression: "variables.containers.all(c, !has(c.envFrom) && (!has(c.env) || c.env.all(e, !has(e.valueFrom))))"
      message: "Environment variables must be literal values: no envFrom, no valueFrom."
    - expression: "variables.containers.all(c, !has(c.command) && !has(c.args))"
      message: "Containers run the image's own entrypoint: no command or args."
    # Lifecycle hooks and exec probes run commands in the container just as
    # a command override would, and probe output reaches Events. An httpGet
    # probe with a host is a request from the node to anywhere.
    - expression: "variables.containers.all(c, !has(c.lifecycle))"
      message: "No lifecycle hooks."
    - expression: >-
        variables.containers.all(c,
          (!has(c.livenessProbe) || (has(c.livenessProbe.httpGet) && !has(c.livenessProbe.httpGet.host) && c.livenessProbe.httpGet.path == '/healthz'))
          && (!has(c.readinessProbe) || (has(c.readinessProbe.httpGet) && !has(c.readinessProbe.httpGet.host) && c.readinessProbe.httpGet.path == '/healthz'))
          && (!has(c.startupProbe) || (has(c.startupProbe.httpGet) && !has(c.startupProbe.httpGet.host) && c.startupProbe.httpGet.path == '/healthz')))
      message: "Probes may only be httpGet on /healthz of the pod itself."
    # Pod Security restricted does not require either of these.
    - expression: >-
        variables.containers.all(c, has(c.securityContext)
          && has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem == true
          && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false)
      message: "Every container needs readOnlyRootFilesystem true and allowPrivilegeEscalation false."
    # Placement and runtime are the scheduler's and the admin's: no pinning
    # to a node, no tolerating a taint, no preempting other pods, no other
    # runtime, no rewriting /etc/hosts, no debug containers.
    - expression: >-
        !has(variables.pod.nodeName) && !has(variables.pod.nodeSelector)
        && !has(variables.pod.affinity) && !has(variables.pod.tolerations)
        && !has(variables.pod.priorityClassName) && !has(variables.pod.runtimeClassName)
        && !has(variables.pod.hostAliases) && !has(variables.pod.ephemeralContainers)
      message: "No nodeName, nodeSelector, affinity, tolerations, priorityClassName, runtimeClassName, hostAliases or ephemeralContainers."
    # The API server defaults it to default-scheduler.
    - expression: "!has(variables.pod.schedulerName) || variables.pod.schedulerName == 'default-scheduler'"
      message: "schedulerName must be default-scheduler."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: __PROJECT_NAMESPACE__-kb-deployer-deployments
  labels:
    app.kubernetes.io/name: knowledgebase
    app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
spec:
  policyName: __PROJECT_NAMESPACE__-kb-deployer-deployments
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: __PROJECT_NAMESPACE__
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: __PROJECT_NAMESPACE__-kb-deployer-ingresses
  labels:
    app.kubernetes.io/name: knowledgebase
    app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  matchConditions:
    - name: deploy-credential-only
      expression: "request.userInfo.username == 'system:serviceaccount:__PROJECT_NAMESPACE__:kb-deployer'"
  validations:
    - expression: "object.metadata.name == 'knowledgebase'"
      message: "kb-deployer may only write the Ingress named knowledgebase."
    - expression: "has(object.spec.ingressClassName) && object.spec.ingressClassName == 'nginx'"
      message: "ingressClassName must be nginx."
    - expression: "!has(object.spec.defaultBackend)"
      message: "No default backend: it would catch every host."
    - expression: "has(object.spec.rules) && size(object.spec.rules) > 0 && object.spec.rules.all(r, has(r.host) && r.host == '__APP_DOMAIN__')"
      message: "Every rule must name the host __APP_DOMAIN__."
    - expression: "has(object.spec.tls) && size(object.spec.tls) > 0 && object.spec.tls.all(t, has(t.hosts) && t.hosts.all(h, h == '__APP_DOMAIN__') && t.secretName == 'knowledgebase-tls')"
      message: "TLS may only cover __APP_DOMAIN__, in the Secret knowledgebase-tls."
    - expression: "object.spec.rules.all(r, !has(r.http) || r.http.paths.all(p, has(p.backend.service) && p.backend.service.name == 'knowledgebase'))"
      message: "Paths may only route to the knowledgebase Service."
    # No ImplementationSpecific paths: ingress-nginx reads them as regexes.
    - expression: >-
        object.spec.rules.all(r, !has(r.http) || r.http.paths.all(p,
          has(p.pathType) && p.pathType in ['Prefix', 'Exact']
          && has(p.path) && p.path.matches('^/[A-Za-z0-9/_.-]*$')))
      message: "Paths must be Prefix or Exact, and plain: a leading / then letters, digits and /_.-"
    # An allowlist: no nginx.ingress.kubernetes.io/* (or any other
    # controller) annotation, and only the production ClusterIssuer.
    - expression: >-
        !has(object.metadata.annotations)
        || object.metadata.annotations.all(k, k in ['cert-manager.io/cluster-issuer', 'kubectl.kubernetes.io/last-applied-configuration'])
      message: "Only the cert-manager.io/cluster-issuer annotation is allowed."
    - expression: >-
        has(object.metadata.annotations) && 'cert-manager.io/cluster-issuer' in object.metadata.annotations
        && object.metadata.annotations['cert-manager.io/cluster-issuer'] == 'letsencrypt-prod'
      message: "The ClusterIssuer must be letsencrypt-prod."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: __PROJECT_NAMESPACE__-kb-deployer-ingresses
  labels:
    app.kubernetes.io/name: knowledgebase
    app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
spec:
  policyName: __PROJECT_NAMESPACE__-kb-deployer-ingresses
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: __PROJECT_NAMESPACE__
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: __PROJECT_NAMESPACE__-kb-deployer-services
  labels:
    app.kubernetes.io/name: knowledgebase
    app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  matchConditions:
    - name: deploy-credential-only
      expression: "request.userInfo.username == 'system:serviceaccount:__PROJECT_NAMESPACE__:kb-deployer'"
  validations:
    - expression: "object.metadata.name == 'knowledgebase'"
      message: "kb-deployer may only write the Service named knowledgebase."
    - expression: "!has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: "The Service must be ClusterIP."
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "No externalIPs."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: __PROJECT_NAMESPACE__-kb-deployer-services
  labels:
    app.kubernetes.io/name: knowledgebase
    app.kubernetes.io/part-of: __PROJECT_NAMESPACE__
spec:
  policyName: __PROJECT_NAMESPACE__-kb-deployer-services
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: __PROJECT_NAMESPACE__
